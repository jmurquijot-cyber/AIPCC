
name: AIPCC Android Build v1.8.7

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Rename debug APK with project version
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AIPCC-v1.8.7-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AIPCC-v1.8.7-debug
          path: app/build/outputs/apk/debug/AIPCC-v1.8.7-debug.apk

      - name: Restore release keystore
        if: github.event_name != 'pull_request'
        env:
          AIPCC_KEYSTORE_BASE64: ${{ secrets.AIPCC_KEYSTORE_BASE64 }}
        run: |
          test -n "$AIPCC_KEYSTORE_BASE64"
          printf '%s' "$AIPCC_KEYSTORE_BASE64" | base64 --decode > app/aipcc-release.jks
          test -s app/aipcc-release.jks

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          AIPCC_KEYSTORE_PASSWORD: ${{ secrets.AIPCC_KEYSTORE_PASSWORD }}
          AIPCC_KEY_ALIAS: ${{ secrets.AIPCC_KEY_ALIAS }}
          AIPCC_KEY_PASSWORD: ${{ secrets.AIPCC_KEY_PASSWORD }}
        run: |
          test -n "$AIPCC_KEYSTORE_PASSWORD"
          test -n "$AIPCC_KEY_ALIAS"
          test -n "$AIPCC_KEY_PASSWORD"
          gradle :app:assembleRelease

      - name: Rename signed release APK with project version
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/AIPCC-v1.8.7-release.apk

      - name: Upload signed release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: AIPCC-v1.8.7-release
          path: app/build/outputs/apk/release/AIPCC-v1.8.7-release.apk
          if-no-files-found: error
